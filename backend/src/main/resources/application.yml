server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/examportal;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
app:
  seed:
    reset-admin-password: ${RESET_ADMIN_PASSWORD:false}
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-long-unique-256-bit-secret-in-production-2026}
    expiration-ms: 86400000
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
